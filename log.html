<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Information</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Apartment Management</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Apartment</a></li>
            </ul>
        </nav>
    </header>

    <section class="log-section">
        <h2>Log Information</h2>
        <form id="logForm">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required><br><br>

            <label for="loginTime">Login Time:</label>
            <input type="datetime-local" id="loginTime" name="loginTime" required><br><br>

            <label for="logoutTime">Logout Time:</label>
            <input type="datetime-local" id="logoutTime" name="logoutTime" required><br><br>

            <label for="doorNumber">Door Number:</label>
            <input type="text" id="doorNumber" name="doorNumber" required><br><br>

            <label for="flatName">Flat Name with Wing:</label>
            <input type="text" id="flatName" name="flatName" required><br><br>

            <button type="submit">Submit</button>
            <button type="button" id="resetButton">Reset</button>
        </form>

        <div id="logDisplay" style="display:none; margin-top: 20px;">
            <h3>Logged Information:</h3>
            <p><strong>Name:</strong> <span id="displayName"></span></p>
            <p><strong>Address:</strong> <span id="displayAddress"></span></p>
            <p><strong>Login Time:</strong> <span id="displayLoginTime"></span></p>
            <p><strong>Logout Time:</strong> <span id="displayLogoutTime"></span></p>
            <p><strong>Door Number:</strong> <span id="displayDoorNumber"></span></p>
            <p><strong>Flat Name with Wing:</strong> <span id="displayFlatName"></span></p>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 Apartment Management</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
